
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой калькулятор</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #20243a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #303650;
            padding: 30px;
            border-radius: 20px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 18px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #6878ff;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #8793ff;
        }

        #result {
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h1>Калькулятор</h1>

        <input type="number" id="num1" placeholder="Первое число">
        <input type="number" id="num2" placeholder="Второе число">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
        </div>

        <div id="result">Результат: 0</div>
    </div>

    <script>
        function calculate(operation) {
            const a = Number(document.getElementById('num1').value);
            const b = Number(document.getElementById('num2').value);
            let result;

            switch (operation) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/':
                    result = b === 0 ? 'На ноль делить нельзя!' : a / b;
                    break;
            }

            document.getElementById('result').textContent =
                'Результат: ' + result;
        }
    </script>

</body>
</html>
